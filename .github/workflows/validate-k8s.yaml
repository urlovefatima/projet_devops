name: Validate Kubernetes manifests

on:
  push:
    paths:
      - 'k8s/**'
      - '.github/workflows/validate-k8s.yaml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'

      - name: Build manifests with Kustomize
        run: kubectl kustomize k8s/overlays/dev > rendered.yaml

      - name: Show rendered manifests
        run: cat rendered.yaml

      - name: Validate manifests with kubeconform (fully offline, no cluster needed)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -summary -kubernetes-version 1.30.0 rendered.yaml

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'

      - name: Create kind cluster
        uses: helm/kind-action@v1

      - name: Deploy to kind (dev overlay)
        run: kubectl apply -k k8s/overlays/dev

      - name: Wait for Ollama rollout
        run: kubectl rollout status deployment/ollama -n llm-app --timeout=120s

      - name: Wait for Open WebUI rollout
        run: kubectl rollout status deployment/open-webui -n llm-app --timeout=300s

      - name: Diagnose Open WebUI on failure
        if: failure()
        run: |
          kubectl get pods -n llm-app -o wide
          kubectl describe pod -n llm-app -l app=open-webui
          kubectl logs -n llm-app -l app=open-webui --tail=100

      - name: Show final state
        run: |
          kubectl get pods -n llm-app
          kubectl get svc -n llm-app

      - name: Install metrics-server
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
          kubectl patch deployment metrics-server -n kube-system --type=json \
            -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          kubectl rollout status deployment metrics-server -n kube-system --timeout=120s

      - name: Wait for metrics to be available
        run: |
          for i in $(seq 1 30); do
            if kubectl top pods -n llm-app > /dev/null 2>&1; then
              echo "Metrics are available."
              kubectl top pods -n llm-app
              break
            fi
            echo "Metrics not ready yet, retrying ($i/30)..."
            sleep 10
          done

      - name: Generate load on Open WebUI
        run: |
          kubectl run loadgen --image=busybox:1.36 --restart=Never -n llm-app -- \
            /bin/sh -c 'i=0; while [ $i -lt 20 ]; do (while true; do wget -q -O- http://open-webui:8080/ >/dev/null 2>&1; done) & i=$((i+1)); done; sleep 240'
          kubectl wait --for=condition=Ready pod/loadgen -n llm-app --timeout=60s

      - name: Watch HPA scale (up to 4 minutes)
        run: |
          for i in $(seq 1 24); do
            echo "--- $(date +%H:%M:%S) ---"
            kubectl get hpa -n llm-app
            kubectl get pods -n llm-app -l app=open-webui
            sleep 10
          done

      - name: Clean up load generator
        if: always()
        run: kubectl delete pod loadgen -n llm-app --ignore-not-found

      - name: Deploy monitoring stack (Prometheus + Grafana)
        run: kubectl apply -f k8s/monitoring/

      - name: Wait for Prometheus and Grafana rollout
        run: |
          kubectl rollout status deployment/prometheus -n monitoring --timeout=180s
          kubectl rollout status deployment/grafana -n monitoring --timeout=180s

      - name: Diagnose monitoring stack on failure
        if: failure()
        run: |
          kubectl get pods -n monitoring -o wide
          kubectl describe pod -n monitoring -l app=prometheus
          kubectl describe pod -n monitoring -l app=grafana
          kubectl logs -n monitoring -l app=prometheus --tail=100
          kubectl logs -n monitoring -l app=grafana --tail=100

      - name: Verify Prometheus targets and query real metrics
        run: |
          kubectl -n monitoring port-forward svc/prometheus 9090:9090 &
          sleep 8

          echo "--- Waiting for at least 2 healthy targets ---"
          for i in $(seq 1 12); do
            UP=$(curl -s http://localhost:9090/api/v1/targets | grep -o '"health":"up"' | wc -l)
            echo "Healthy targets so far: $UP"
            if [ "$UP" -ge 2 ]; then break; fi
            sleep 10
          done

          echo "=== Prometheus targets (raw JSON) ==="
          curl -s http://localhost:9090/api/v1/targets | python3 -m json.tool

          echo "=== Sample PromQL query: CPU usage by pod in llm-app namespace ==="
          curl -s 'http://localhost:9090/api/v1/query?query=sum(rate(container_cpu_usage_seconds_total%7Bnamespace%3D%22llm-app%22%7D%5B1m%5D))%20by%20(pod)' | python3 -m json.tool

          echo "=== Sample PromQL query: memory usage by pod in llm-app namespace ==="
          curl -s 'http://localhost:9090/api/v1/query?query=sum(container_memory_working_set_bytes%7Bnamespace%3D%22llm-app%22%7D)%20by%20(pod)' | python3 -m json.tool

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Screenshot Grafana dashboard
        run: |
          kubectl -n monitoring port-forward svc/grafana 3000:3000 &
          sleep 8
          node .github/scripts/grafana-screenshot.js

      - name: Upload Grafana screenshot as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grafana-dashboard-screenshot
          path: |
            grafana-dashboard.png
            grafana-debug-failure.png
          if-no-files-found: warn
