version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama

    ports:
      - "${OLLAMA_PORT}:11434"

    volumes:
      - ollama:/root/.ollama

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - llm

  open-webui:
    image: ghcr.io/open-webui/open-webui:main

    container_name: open-webui

    depends_on:
      ollama:
        condition: service_healthy

    ports:
      - "${WEBUI_PORT}:8080"

    environment:
      OLLAMA_BASE_URL: http://ollama:11434

    volumes:
      - open-webui:/app/backend/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - llm

volumes:
  ollama:
  open-webui:

networks:
  llm:
    driver: bridge