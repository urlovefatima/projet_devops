# Dev overlay: lower resource requests/limits, only 1 replica max on the HPA
# so the environment fits on a small machine.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: llm-app
spec:
  template:
    spec:
      containers:
        - name: ollama
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: llm-app
spec:
  template:
    spec:
      containers:
        - name: open-webui
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: open-webui-hpa
  namespace: llm-app
spec:
  maxReplicas: 2
